# ==============================================================================
# Nginx Reverse Proxy Configuration (HTTP Only / Pre-Certbot)
# Place in: /etc/nginx/sites-available/deployment_workshop.conf
# Enable: ln -s /etc/nginx/sites-available/deployment_workshop.conf /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt ACME challenge webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Proxy to Flask/Gunicorn running on localhost:5000
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
