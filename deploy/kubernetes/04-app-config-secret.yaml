apiVersion: v1
kind: ConfigMap
metadata:
  name: workshop-config
  namespace: deployment-workshop
data:
  PORT: "5000"
  APP_ENV: "production"
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "deployment_workshop"
  MYSQL_USER: "workshop_user"
---
apiVersion: v1
kind: Secret
metadata:
  name: workshop-secrets
  namespace: deployment-workshop
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "workshop_root_pass_k8s"
  MYSQL_PASSWORD: "workshop_secret_pass_k8s"
  SECRET_KEY: "k8s-production-secret-key-replace-me"
