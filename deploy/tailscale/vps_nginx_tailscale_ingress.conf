# ==============================================================================
# VPS Ingress Reverse Proxy over Tailscale
# Place this file on your public-facing VPS:
# /etc/nginx/sites-available/workshop_tailscale_gateway.conf
#
# This configuration:
# 1. Listens on the VPS public IP for your domain (ports 80 & 443).
# 2. Terminates Let's Encrypt SSL on the VPS (public visitors see valid SSL).
# 3. Forwards requests across your encrypted Tailscale mesh network to your home server.
# 4. Hides your home IP address and completely avoids dynamic IP / DDNS issues.
# ==============================================================================

# 1. HTTP Redirect to HTTPS on the VPS
server {
    listen 80;
    listen [::]:80;
    server_name workshop.yourdomain.com;

    # Let's Encrypt ACME challenge location for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Gateway Proxying into Tailscale Mesh
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name workshop.yourdomain.com;

    # SSL Certificates managed by Certbot on the VPS
    ssl_certificate /etc/letsencrypt/live/workshop.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workshop.yourdomain.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size
    client_max_body_size 16M;

    # Forward to Home Server via Tailscale
    # Replace 100.x.y.z with your Home Server's Tailscale IPv4 address
    # (or use its MagicDNS name: http://home-server.your-tailnet.ts.net:5000)
    location / {
        proxy_pass http://100.x.y.z:5000;
        proxy_http_version 1.1;

        # Preserve client headers so the Flask app sees real visitor IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Timeouts for database queries and long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Enable buffer optimization across the Tailscale mesh
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
