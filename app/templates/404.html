{% extends "base.html" %}

{% block title %}404 Not Found - Deployment Workshop{% endblock %}

{% block content %}
<div class="py-16 text-center space-y-4">
    <div class="inline-flex p-4 rounded-full bg-rose-500/10 text-rose-400 mb-2 border border-rose-500/20">
        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
    </div>
    <h1 class="text-3xl font-extrabold text-white">404 - Page Not Found</h1>
    <p class="text-slate-400 max-w-md mx-auto text-sm">The endpoint or resource you requested does not exist in this deployment.</p>
    <div class="pt-4">
        <a href="{{ url_for('main.index') }}" class="inline-flex items-center px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition shadow-lg shadow-indigo-600/30">
            Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
