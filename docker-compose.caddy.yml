services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deployment_workshop_web_caddy
    restart: always
    expose:
      - "5000"
    environment:
      - PORT=5000
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-workshop_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-workshop_secret_pass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-deployment_workshop}
      - SECRET_KEY=${SECRET_KEY:-change-in-production-env}
      - APP_ENV=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - caddy_net

  db:
    image: mysql:8.0
    container_name: deployment_workshop_db_caddy
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-workshop_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deployment_workshop}
      MYSQL_USER: ${MYSQL_USER:-workshop_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-workshop_secret_pass}
    volumes:
      - mysql_caddy_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-workshop_root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - caddy_net

  caddy:
    image: caddy:alpine
    container_name: deployment_workshop_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - caddy_net

volumes:
  mysql_caddy_data:
  caddy_data:
  caddy_config:

networks:
  caddy_net:
    driver: bridge
